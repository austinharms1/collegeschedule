<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>College Schedule</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:16px;position:sticky;top:0;z-index:20}
h1{font-size:23px;margin:0} .sub{font-size:13px;opacity:.7;margin-top:2px}
.tabs{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:69px;z-index:19}
.tab{flex:1;padding:13px 8px;border:0;background:#fff;font-weight:700;font-size:14px;color:#6b7280}
.tab.active{color:#111827;border-bottom:3px solid #111827}
.page{display:none} .page.active{display:block}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px;max-width:1000px;margin:auto}
.day{font-weight:700;text-align:center;padding:8px;background:#fff;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 10px 30px;max-width:1000px;margin:auto}
.col{min-height:650px;background:#e5e7eb;border-radius:12px;padding:6px}
.card{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px #0001;cursor:pointer}
.time{font-size:12px;color:#6b7280} .course{font-weight:800;margin:3px 0} .type{font-size:12px} .room{font-size:12px;color:#4b5563;margin-top:4px}
.map-tools{padding:10px;background:#fff;display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:117px;z-index:10}
.map-tools button,.modal button{border:0;border-radius:9px;padding:9px 12px;background:#374151;color:#fff;font-weight:600}
.map-wrap{margin:10px;border-radius:14px;overflow:auto;background:#d1d5db;box-shadow:0 1px 4px #0002;max-height:calc(100vh - 190px);touch-action:pan-x pan-y}
.map-canvas{position:relative;width:100%;min-width:700px;line-height:0;transform-origin:top left}
.map-canvas img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:#dc2626;color:#fff;width:38px;height:38px;border-radius:50% 50% 50% 0;rotate:-45deg;box-shadow:0 2px 5px #0005;cursor:pointer}
.pin span{display:block;rotate:45deg;font-size:11px;font-weight:800}
.pin.active{background:#111827}
.building-list{padding:0 10px 25px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.building{background:#fff;border:0;border-radius:10px;padding:12px;text-align:left;box-shadow:0 1px 3px #0001}
.building b{display:block} .building small{color:#6b7280}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:center;justify-content:center;padding:20px}
.box{background:#fff;border-radius:16px;padding:20px;max-width:390px;width:100%;box-shadow:0 10px 30px #0005}
.box h2{margin:0 0 10px} .box p{line-height:1.5}
@media(max-width:700px){
.week{display:none} .grid{grid-template-columns:1fr;padding:10px} .col{min-height:auto}
.col:before{content:attr(data-day);display:block;font-weight:800;padding:6px}
.map-tools{top:117px} .building-list{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header><h1>College Schedule</h1><div class="sub">Fall 2026 • Purdue Indianapolis</div></header>
<nav class="tabs">
<button class="tab active" onclick="showPage('schedulePage',this)">Schedule</button>
<button class="tab" onclick="showPage('mapPage',this)">📍 Map</button>
<button class="tab" onclick="showPage('scheduleGrid',this)">Schedule Grid</button>
</nav>

<section id="schedulePage" class="page active">
<div class="week"><div class="day">Monday</div><div class="day">Tuesday</div><div class="day">Wednesday</div><div class="day">Thursday</div><div class="day">Friday</div></div>
<div class="grid" id="schedule"></div>
</section>

<section id="mapPage" class="page">
<div class="map-tools">
<button onclick="zoomMap(1.2)">＋ Zoom</button>
<button onclick="zoomMap(.8333)">− Zoom</button>
<button onclick="resetMap()">Reset</button>
<button onclick="locateBuilding('LE')">My buildings</button>
</div>
<div class="map-wrap" id="mapWrap">
<div class="map-canvas" id="mapCanvas">
<img src="Map.png">
<button class="pin" style="left:31.4%;top:53.6%" onclick="buildingInfo('LE')"><span>LE</span></button>
<button class="pin" style="left:36.1%;top:64.2%" onclick="buildingInfo('ES')"><span>ES</span></button>
<button class="pin" style="left:64.7%;top:36.6%" onclick="buildingInfo('IO')"><span>IO</span></button>
<button class="pin" style="left:46.1%;top:36.4%" onclick="buildingInfo('ET')"><span>ET</span></button>
<button class="pin" style="left:38.3%;top:18.8%" onclick="buildingInfo('IP')"><span>IP</span></button>
</div></div>
<div class="building-list">
<button class="building" onclick="buildingInfo('LE')"><b>LE — Lecture Hall</b><small>MA 26100</small></button>
<button class="building" onclick="buildingInfo('ES')"><b>ES — University Hall</b><small>MA 26100 Recitation</small></button>
<button class="building" onclick="buildingInfo('IO')"><b>IO — Informatics</b><small>PHYS 17200 Lecture</small></button>
<button class="building" onclick="buildingInfo('ET')"><b>ET — Engineering</b><small>ENGR 10401 • PHYS 17200 • VIP 17911</small></button>
<button class="building" onclick="buildingInfo('IP')"><b>IP — Institute/Engineering building</b><small>ENGR 13300 Studio</small></button>
</div>
</section>

<section id="scheduleGrid" class="page">
<img src="scheduleGrid.png" style="width:100%;height:auto;display:block;">
</section>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
<div class="box"><h2 id="mTitle"></h2><div id="mInfo"></div><button onclick="closeModal()">Close</button></div>
</div>

<script>
const classes=[
{d:"Monday",t:"9:30–10:20 AM",c:"MA 26100",type:"Lecture",r:"LE 102",p:"S Yassemi"},
{d:"Monday",t:"11:30 AM–12:20 PM",c:"PHIL 22100",type:"Lecture",r:"ET 308",p:"A T Vrabely"},
{d:"Tuesday",t:"9:30–10:20 AM",c:"MA 26100",type:"Recitation",r:"ES 2106",p:"P J Carper"},
{d:"Tuesday",t:"10:30–11:20 AM",c:"PHYS 17200",type:"Lecture",r:"IO 102",p:"C M Rebello"},
{d:"Tuesday",t:"1:30–3:20 PM",c:"ENGR 13300",type:"Studio",r:"IP 118",p:"S Banik"},
{d:"Tuesday",t:"3:30–4:20 PM",c:"ENGR 10401",type:"Lecture (Hybrid)",r:"ET 329",p:"S G Hillan"},
{d:"Wednesday",t:"9:30–10:20 AM",c:"MA 26100",type:"Lecture",r:"LE 102",p:"S Yassemi"},
{d:"Wednesday",t:"11:30 AM–12:20 PM",c:"PHIL 22100",type:"Lecture",r:"ET 308",p:"A T Vrabely"},
{d:"Thursday",t:"10:30–11:20 AM",c:"PHYS 17200",type:"Lecture",r:"IO 102",p:"C M Rebello"},
{d:"Thursday",t:"11:30 AM–1:20 PM",c:"PHYS 17200",type:"Lab",r:"IO 276",p:"G Sm"},
{d:"Thursday",t:"1:30–3:20 PM",c:"ENGR 13300",type:"Studio",r:"IP 118",p:"S Banik"},
{d:"Thursday",t:"4:30–6:20 PM",c:"VIP 17911",type:"Lab",r:"ET 010",p:"S C Rausch / M C Johnson"},
{d:"Friday",t:"9:30–10:20 AM",c:"MA 26100",type:"Lecture",r:"LE 102",p:"S Yassemi"},
{d:"Friday",t:"11:30 AM–12:20 PM",c:"PHIL 22100",type:"Lecture",r:"ET 308",p:"A T Vrabely"},
{d:"Friday",t:"1:30–2:20 PM",c:"PHYS 17200",type:"Recitation",r:"ET 302",p:"Y Ulu"}
];
const days=["Monday","Tuesday","Wednesday","Thursday","Friday"];
const root=document.getElementById("schedule");
days.forEach(day=>{
 const col=document.createElement("div");col.className="col";col.dataset.day=day;
 classes.filter(x=>x.d===day).forEach(x=>{
  const card=document.createElement("div");card.className="card";
  card.innerHTML=`<div class="time">${x.t}</div><div class="course">${x.c}</div><div class="type">${x.type}</div><div class="room">${x.r}</div>`;
  card.onclick=()=>showClass(x);col.appendChild(card);
 });
 root.appendChild(col);
});
const buildings={
LE:{name:"LE — Lecture Hall",desc:"MA 26100 lecture meets here.",rooms:["LE 102"],classes:["MA 26100"]},
ES:{name:"ES — University Hall",desc:"MA 26100 recitation meets here.",rooms:["ES 2106"],classes:["MA 26100 Recitation"]},
IO:{name:"IO — Informatics",desc:"PHYS 17200 lecture meets here.",rooms:["IO 102"],classes:["PHYS 17200 Lecture"]},
ET:{name:"ET — Engineering",desc:"Several of your classes meet in this building.",rooms:["ET 329","ET 308","ET 302","ET 010"],classes:["ENGR 10401","PHIL 22100","PHYS 17200 Recitation","VIP 17911 Lab"]},
IP:{name:"IP — Engineering/Institute building",desc:"ENGR 13300 studio meets here.",rooms:["IP 118"],classes:["ENGR 13300"]}
};
let scale=1;
function showPage(id,btn){
 document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 btn.classList.add("active");
}
function showClass(x){
 document.getElementById("mTitle").textContent=x.c;
 document.getElementById("mInfo").innerHTML=`<p><b>${x.type}</b><br>${x.d} • ${x.t}<br>Room: ${x.r}<br>Instructor: ${x.p}</p>`;
 document.getElementById("modal").style.display="flex";
}
function buildingInfo(id){
 const b=buildings[id];
 document.getElementById("mTitle").textContent=b.name;
 document.getElementById("mInfo").innerHTML=`<p>${b.desc}</p><p><b>Rooms:</b> ${b.rooms.join(", ")}</p><p><b>Your classes:</b><br>${b.classes.join("<br>")}</p>`;
 document.getElementById("modal").style.display="flex";
}
function closeModal(){document.getElementById("modal").style.display="none"}
function zoomMap(f){scale=Math.max(.7,Math.min(2.5,scale*f));document.getElementById("mapCanvas").style.width=(100*scale)+"%"}
function resetMap(){scale=1;document.getElementById("mapCanvas").style.width="100%"}
function locateBuilding(id){document.getElementById("mapPage").scrollIntoView();buildingInfo(id)}

</script>
</body>
</html>
